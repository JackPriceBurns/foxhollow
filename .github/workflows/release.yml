name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  actions: write

jobs:
  create:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract release notes
        run: |
          python3 .github/scripts/changelog.py \
            --version "${GITHUB_REF_NAME}" \
            --format markdown > "${RUNNER_TEMP}/notes.md"
          echo "Release notes for ${GITHUB_REF_NAME}:"
          cat "${RUNNER_TEMP}/notes.md"

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "${GITHUB_REF_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            channel_flags=(--latest)
          elif [[ "${GITHUB_REF_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-beta\.[0-9]+$ ]]; then
            channel_flags=(--prerelease --latest=false)
          else
            echo "::error::${GITHUB_REF_NAME} is neither vX.Y.Z nor vX.Y.Z-beta.N"
            exit 1
          fi
          gh release create "${GITHUB_REF_NAME}" \
            --title "${GITHUB_REF_NAME}" \
            --notes-file "${RUNNER_TEMP}/notes.md" \
            --verify-tag \
            "${channel_flags[@]}"

      - name: Start the publish workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run publish.yml \
            --ref "${GITHUB_REF_NAME}" \
            -f tag="${GITHUB_REF_NAME}"
